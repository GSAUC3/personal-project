[project]
name = "industrial-inspection-systems"
version = "1.0.0"
description = "An end-to-end computer vision based industrial application"
authors = [
    { name = "Rajarshi Banerjee", email = "rajarshiban13@gmail.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "opencv-python (>=4.10,<5.0)",
    "fastapi (>=0.165.0,<0.166.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.2.0,<10.0.0"

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
ipykernel = "^7.4.0"
matplotlib = "^3.11.2"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
